{% extends 'admin/base_site.html' %}
{% load i18n %}

{% block content %}
<div class="px-4 py-6 md:px-6 lg:px-8">
    <div class="bg-white dark:bg-gray-800 rounded-md shadow-sm p-6 max-w-2xl border border-gray-200 dark:border-gray-700">
        <h2 class="text-xl font-semibold mb-4 text-gray-800 dark:text-gray-200">{{ title }}</h2>
        
        <form method="post">
            {% csrf_token %}
            
            <div class="mb-4">
                <label for="{{ form.batch_year.id_for_label }}" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                    Batch Year
                </label>
                <input type="number" name="{{ form.batch_year.html_name }}" id="{{ form.batch_year.id_for_label }}" 
                       value="{{ form.batch_year.value|default_if_none:'' }}" min="1" max="5" required
                       class="block w-full rounded-md border border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500 sm:text-sm px-3 py-2 dark:bg-gray-900 dark:border-gray-600 dark:text-white">
                {% if form.batch_year.help_text %}
                    <p class="mt-2 text-sm text-gray-500 dark:text-gray-400">{{ form.batch_year.help_text }}</p>
                {% endif %}
                {% if form.batch_year.errors %}
                    <p class="mt-2 text-sm text-red-600 font-medium">{{ form.batch_year.errors.0 }}</p>
                {% endif %}
            </div>

            <div class="mt-6 flex items-center gap-3">
                <button type="submit" class="bg-primary-600 text-white px-4 py-2 rounded-md hover:bg-primary-700 font-medium transition-colors cursor-pointer border border-transparent shadow-sm">
                    Enroll Students
                </button>
                <a href="{% url 'admin:course_semestercourse_change' object.pk %}" class="bg-white text-gray-700 border border-gray-300 shadow-sm dark:bg-gray-800 dark:text-gray-300 dark:border-gray-600 dark:hover:bg-gray-700 px-4 py-2 rounded-md hover:bg-gray-50 font-medium transition-colors cursor-pointer">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
